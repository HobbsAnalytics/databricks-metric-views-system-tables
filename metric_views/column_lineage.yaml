version: 1.1

# Fact: system.access.column_lineage (one column read/write lineage event).
# Joins to query.history AS A DIMENSION via the documented statement_id FK. N:1.
source: system.access.column_lineage

comment: Unity Catalog column lineage events with workspace and originating-query context.

joins:
  - name: ws
    source: system.access.workspaces_latest
    "on": source.workspace_id = ws.workspace_id
    cardinality: many_to_one
    rely:
      at_most_one_match: true

  - name: query
    source: |
      SELECT workspace_id, statement_id, statement_type, execution_status, executed_by, start_time AS query_start_time
      FROM system.query.history
    "on": query.workspace_id = source.workspace_id
      AND query.statement_id = source.statement_id
    cardinality: many_to_one
    rely:
      at_most_one_match: true

dimensions:
  - name: Event Time
    expr: source.event_time
  - name: Event Date
    expr: source.event_date
  - name: Workspace ID
    expr: source.workspace_id
  - name: Workspace Name
    expr: ws.workspace_name
  - name: Entity Type
    expr: source.entity_type
  - name: Source Table
    expr: source.source_table_full_name
  - name: Source Column
    expr: source.source_column_name
  - name: Target Table
    expr: source.target_table_full_name
  - name: Target Column
    expr: source.target_column_name
  - name: Created By
    expr: source.created_by
  - name: Query Statement Type
    expr: query.statement_type
  - name: Query Execution Status
    expr: query.execution_status

measures:
  - name: Lineage Events
    expr: COUNT(1)
  - name: Distinct Source Columns
    expr: COUNT(DISTINCT source.source_table_full_name || '.' || source.source_column_name)
  - name: Distinct Target Columns
    expr: COUNT(DISTINCT source.target_table_full_name || '.' || source.target_column_name)
  - name: Distinct Statements
    expr: COUNT(DISTINCT source.statement_id)
