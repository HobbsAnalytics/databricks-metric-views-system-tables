# Misc workspace-scoped facts. Each is a separate metric view sharing a workspace
# join. Deployed as: materialization_history_metrics, predictive_optimization_metrics,
# zerobus_ingest_metrics, zerobus_stream_metrics.

# ============================================================
# materialization_history_metrics
# ============================================================
--- materialization_history
version: 1.1
source: system.sharing.materialization_history
comment: Delta Sharing materialization events with workspace context.
joins:
  - name: ws
    source: system.access.workspaces_latest
    "on": source.workspace_id = ws.workspace_id
    cardinality: many_to_one
    rely:
      at_most_one_match: true
dimensions:
  - name: Created At
    expr: source.created_at
    comment: Timestamp of when the materialization was created.
  - name: Created Date
    expr: CAST(source.created_at AS DATE)
    comment: Calendar date the materialization was created.
    format:
      type: date
      date_format: year_month_day
  - name: Workspace ID
    expr: source.workspace_id
    comment: The ID of the Databricks workspace where the materialization was billed to.
  - name: Workspace Name
    expr: ws.workspace_name
    comment: The human-readable name of the workspace.
  - name: Recipient Name
    expr: source.recipient_name
    comment: The name of the downstream recipient using the data materialization.
  - name: Provider Name
    expr: source.provider_name
    comment: The name of the upstream provider using the data materialization.
  - name: Share Name
    expr: source.share_name
    comment: Name of share used to create materialization.
  - name: Schema Name
    expr: source.schema_name
    comment: Name of the schema of the shared asset used to create materialization.
  - name: Table Name
    expr: source.table_name
    comment: Name of the table used to create materialization.
measures:
  - name: Materialization Events
    expr: COUNT(1)
    comment: Number of materialization events in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Distinct Recipients
    expr: COUNT(DISTINCT source.recipient_name)
    comment: Distinct number of downstream recipients.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Distinct Shares
    expr: COUNT(DISTINCT source.share_name)
    comment: Distinct number of shares.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

# ============================================================
# predictive_optimization_metrics
# ============================================================
--- predictive_optimization
version: 1.1
source: system.storage.predictive_optimization_operations_history
comment: Predictive optimization operations with workspace context.
joins:
  - name: ws
    source: system.access.workspaces_latest
    "on": source.workspace_id = ws.workspace_id
    cardinality: many_to_one
    rely:
      at_most_one_match: true
dimensions:
  - name: Start Time
    expr: source.start_time
    comment: The time at which the operation started. Recorded in UTC.
  - name: Start Date
    expr: CAST(source.start_time AS DATE)
    comment: Calendar date the operation started.
    format:
      type: date
      date_format: year_month_day
  - name: Workspace ID
    expr: source.workspace_id
    comment: The ID of the workspace in which predictive optimization ran the operation.
  - name: Workspace Name
    expr: ws.workspace_name
    comment: The human-readable name of the workspace.
  - name: Operation Type
    expr: source.operation_type
    comment: The optimization operation which was performed.
  - name: Operation Status
    expr: source.operation_status
    comment: The status of the optimization operation (SUCCESSFUL or FAILED with a specific error type).
  - name: Metastore Name
    expr: source.metastore_name
    comment: The name of the metastore to which the optimized table belongs.
  - name: Catalog Name
    expr: source.catalog_name
    comment: The name of the catalog to which the optimized table belongs.
  - name: Schema Name
    expr: source.schema_name
    comment: The name of the schema to which the optimized table belongs.
  - name: Table Name
    expr: source.table_name
    comment: The name of the optimized table.
measures:
  - name: Operations
    expr: COUNT(1)
    comment: Number of predictive optimization operations in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Successful Operations
    expr: COUNT(1) FILTER (WHERE source.operation_status = 'SUCCESSFUL')
    comment: Number of operations that completed successfully.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Total Usage Quantity
    expr: SUM(source.usage_quantity)
    comment: Total amount of the usage unit consumed by these operations.
    format:
      type: number
      decimal_places:
        type: exact
        places: 2
  - name: Distinct Tables
    expr: COUNT(DISTINCT source.table_id)
    comment: Distinct number of optimized tables in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

# ============================================================
# zerobus_ingest_metrics
# ============================================================
--- zerobus_ingest
version: 1.1
source: system.lakeflow.zerobus_ingest
comment: Zerobus ingestion commit records with workspace context (Beta).
joins:
  - name: ws
    source: system.access.workspaces_latest
    "on": source.workspace_id = ws.workspace_id
    cardinality: many_to_one
    rely:
      at_most_one_match: true
dimensions:
  - name: Commit Time
    expr: source.commit_time
    comment: Time of the commit.
  - name: Commit Date
    expr: CAST(source.commit_time AS DATE)
    comment: Calendar date of the commit.
    format:
      type: date
      date_format: year_month_day
  - name: Workspace ID
    expr: source.workspace_id
    comment: ID of the workspace that the stream is created in.
  - name: Workspace Name
    expr: ws.workspace_name
    comment: The human-readable name of the workspace.
  - name: Stream ID
    expr: source.stream_id
    comment: ID of the stream that performed the ingestion.
  - name: Table Name
    expr: source.table_name
    comment: Fully qualified table name in human readable format.
measures:
  - name: Commits
    expr: COUNT(1)
    comment: Number of ingestion commits in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Total Committed Bytes
    expr: SUM(source.committed_bytes)
    comment: Total size of ingested data in bytes.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Total Committed Records
    expr: SUM(source.committed_records)
    comment: Total number of committed records.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Distinct Streams
    expr: COUNT(DISTINCT source.stream_id)
    comment: Distinct number of streams in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0

# ============================================================
# zerobus_stream_metrics
# ============================================================
--- zerobus_stream
version: 1.1
source: system.lakeflow.zerobus_stream
comment: Zerobus stream events with workspace context (Beta).
joins:
  - name: ws
    source: system.access.workspaces_latest
    "on": source.workspace_id = ws.workspace_id
    cardinality: many_to_one
    rely:
      at_most_one_match: true
dimensions:
  - name: Event Time
    expr: source.event_time
    comment: Time of log event.
  - name: Event Date
    expr: CAST(source.event_time AS DATE)
    comment: Calendar date of the event.
    format:
      type: date
      date_format: year_month_day
  - name: Workspace ID
    expr: source.workspace_id
    comment: ID of the workspace that the stream is created in.
  - name: Workspace Name
    expr: ws.workspace_name
    comment: The human-readable name of the workspace.
  - name: Stream ID
    expr: source.stream_id
    comment: ID of the created stream.
  - name: Producer ID
    expr: source.producer_id
    comment: Custom ID of the client producer application used to ingest data.
  - name: Table Name
    expr: source.table_name
    comment: Fully qualified table name in human readable format.
  - name: Protocol
    expr: source.protocol
    comment: Protocol used for data ingestion.
  - name: Data Format
    expr: source.data_format
    comment: Data format used for passing data.
measures:
  - name: Stream Events
    expr: COUNT(1)
    comment: Number of stream events in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Distinct Streams
    expr: COUNT(DISTINCT source.stream_id)
    comment: Distinct number of streams in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
  - name: Distinct Producers
    expr: COUNT(DISTINCT source.producer_id)
    comment: Distinct number of producer applications in the slice.
    format:
      type: number
      decimal_places:
        type: exact
        places: 0
